<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-POS Professional - Market Edition</title>
    <style>
        :root {
            --s-green: #008a3d;
            --danger: #e30613;
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --text: #ffffff;
            --receipt-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-left-color: var(--s-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .header {
            background: #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--s-green);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 450px;
            flex-grow: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        #receipt-container {
            background: var(--receipt-bg);
            color: #000;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #r-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .receipt-row.selected { 
            background: #e8f5e9; 
            border-left: 8px solid var(--s-green);
            padding-left: 5px;
        }

        .display-unit {
            background: #000;
            padding: 25px;
            text-align: right;
            border: 2px solid #444;
            border-radius: 5px;
        }

        #total-val { font-size: 4.5rem; color: var(--s-green); font-weight: bold; line-height: 1; }
        #buffer-val { font-size: 1.8rem; color: #fff; min-height: 2rem; letter-spacing: 2px; }

        .quick-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 10px;
            background: var(--panel);
            border-radius: 5px;
        }

        .q-btn {
            background: linear-gradient(145deg, #444, #222);
            border: 1px solid #555;
            color: white;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .footer {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            padding: 8px;
            background: #000;
        }

        .f-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 12px 0;
            cursor: pointer;
            font-size: 0.7rem;
            border-radius: 3px;
        }

        .f-btn span { display: block; font-weight: bold; color: var(--s-green); }

        #modal-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-inner {
            background: var(--panel);
            padding: 30px;
            border-radius: 10px;
            min-width: 400px;
            border: 2px solid #555;
        }

        .modal-btn {
            padding: 18px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            background: #444;
            color: white;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="header">
    <div>KASSA: 01 | MYYJÄ: 001</div>
    <div id="member-display"></div>
    <div id="date-time"></div>
</div>

<div class="main-container">
    <div id="receipt-container">
        <div id="r-list"></div>
        <div id="receipt-footer" style="padding:15px; border-top:2px solid #eee; background:#f9f9f9; color:#333;">
            <div style="display:flex; justify-content:space-between; font-size:1.4rem; font-weight:bold;">
                <span>VÄLISUMMA:</span><span id="subtotal-display">0.00 €</span>
            </div>
        </div>
    </div>

    <div class="side-panel" style="display:flex; flex-direction:column; gap:10px;">
        <div class="display-unit">
            <div id="buffer-val">0,00</div>
            <div id="total-val">0.00</div>
        </div>

        <div class="quick-keys" id="quick-keys-bar"></div>

        <div style="flex-grow:1; background:var(--panel); padding:15px; border-radius:5px; border:1px solid #444;">
            <h3 style="margin-top:0; color:var(--s-green);">TUOTEHAKU</h3>
            <input type="text" id="search-input" placeholder="Hae..." oninput="searchProducts(this.value)" 
                   style="width:100%; padding:12px; background:#000; color:#fff; border:1px solid #555; box-sizing:border-box;">
            <div id="search-results" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<div class="footer">
    <button class="f-btn" onclick="pay('KORTTI')"><span>F1</span>KORTTI</button>
    <button class="f-btn" onclick="pay('KÄTEINEN')"><span>F2</span>KÄTEINEN</button>
    <button class="f-btn" onclick="toggleReturnMode()"><span>F4</span>PALAUTUS</button>
    <button class="f-btn" onclick="clr()"><span>F5</span>TYHJENNÄ</button>
    <button class="f-btn" onclick="deleteItem()"><span>F6</span>POISTA RIVI</button>
    <button class="f-btn" onclick="clearReceipt()"><span>F7</span>UUSI ASIAKAS</button>
    <button class="f-btn" onclick="openDiscountMenu()"><span>F10</span>ALENNUS</button>
    <button class="f-btn" onclick="sellGiftCard()"><span>F11</span>LAHJAKORTTI</button>
</div>

<div id="modal-container">
    <div id="modal-inner"></div>
</div>

<script>
    const products = {
        "1": { name: "Maito 1L", price: 1.15 },
        "2": { name: "Ruisleipä", price: 2.45 },
        "3": { name: "Kahvi 500g", price: 5.95 },
        "4": { name: "Muovikassi", price: 0.25 }
    };

    let items = [];
    let bufStr = "";
    let returnMode = false;
    let selectedIdx = -1;

    // --- PUSKURI & NÄPPÄIMET ---
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key >= '0' && e.key <= '9') { 
            bufStr += e.key; 
            updateBuffer(); 
        }
        if (e.key === 'Enter') {
            if (bufStr !== "") {
                addItem(bufStr);
                clr();
            }
        }
        if (e.key === 'Backspace') { 
            bufStr = bufStr.slice(0,-1); 
            updateBuffer(); 
        }
        if (e.key === 'Escape') closeModal();
    });

    function updateBuffer() {
        const display = document.getElementById('buffer-val');
        if (bufStr === "") {
            display.innerText = "0,00";
        } else {
            const val = (parseInt(bufStr) / 100).toFixed(2);
            display.innerText = val.replace('.', ',');
        }
    }

    function clr() {
        bufStr = "";
        updateBuffer();
    }

    function clearReceipt() {
        items = [];
        returnMode = false;
        clr();
        render();
    }

    // --- TUOTTEIDEN KÄSITTELY ---
    function addItem(id) {
        const p = products[id];
        if (p) {
            let price = returnMode ? -Math.abs(p.price) : p.price;
            items.push({ name: p.name, price: price });
            selectedIdx = items.length - 1;
            render();
        }
    }

    function deleteItem() {
        if (selectedIdx > -1) {
            items.splice(selectedIdx, 1);
            selectedIdx = items.length - 1;
            render();
        }
    }

    function toggleReturnMode() {
        returnMode = !returnMode;
        render();
    }

    function render() {
        const list = document.getElementById('r-list');
        const totalDisp = document.getElementById('total-val');
        const subtotalDisp = document.getElementById('subtotal-display');
        
        list.innerHTML = "";
        let total = 0;

        if (returnMode) {
            const header = document.createElement('div');
            header.style = "background:var(--danger); color:white; text-align:center; padding:5px; font-weight:bold; margin-bottom:10px;";
            header.innerText = "PALAUTUSTILA";
            list.appendChild(header);
        }

        items.forEach((it, i) => {
            total += it.price;
            const row = document.createElement('div');
            row.className = `receipt-row ${selectedIdx === i ? 'selected' : ''}`;
            row.onclick = () => { selectedIdx = i; render(); };
            row.innerHTML = `<span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)} €</span>`;
            list.appendChild(row);
        });

        totalDisp.innerText = total.toFixed(2);
        subtotalDisp.innerText = total.toFixed(2) + " €";
        list.scrollTop = list.scrollHeight;
    }

    // --- MAKSAMINEN ---
    function pay(method) {
        const total = parseFloat(document.getElementById('total-val').innerText);
        if (items.length === 0) return;

        if (method === 'KÄTEINEN') {
            let given = bufStr !== "" ? parseInt(bufStr) / 100 : total;
            if (given < total && !returnMode) {
                alert("SYÖTETTY SUMMA EI RIITÄ!");
                return;
            }
            showChange(total, given);
        } else {
            simulateCard(total);
        }
    }

    function showChange(total, given) {
        const change = given - total;
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        inner.innerHTML = `
            <div style="text-align:center; color:white;">
                <h2>TAKAISIN:</h2>
                <h1 style="font-size:4rem; color:var(--s-green);">${change.toFixed(2)} €</h1>
                <button class="modal-btn" onclick="finalize()">VALMIS / TULOSTA</button>
            </div>`;
    }

    function simulateCard(amount) {
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        inner.innerHTML = `
            <div style="text-align:center; color:white;">
                <div class="spinner"></div>
                <h2 id="card-status">ODOTTAA KORTTIA...</h2>
                <p>SUMMA: ${amount.toFixed(2)} €</p>
            </div>`;
        
        setTimeout(() => { document.getElementById('card-status').innerText = "KÄSITELLÄÄN..."; }, 1500);
        setTimeout(() => { 
            document.getElementById('card-status').innerText = "HYVÄKSYTTY!";
            setTimeout(() => finalize(), 1000);
        }, 3000);
    }

    function finalize() {
        closeModal();
        alert("Kuitti tulostettu. Aloitetaan uusi kauppa.");
        clearReceipt();
    }

    function closeModal() {
        document.getElementById('modal-container').style.display = 'none';
    }

    // --- APUTOIMINNOT ---
    function searchProducts(q) {
        const res = document.getElementById('search-results');
        res.innerHTML = "";
        if (q.length < 1) return;
        for (let id in products) {
            if (products[id].name.toLowerCase().includes(q.toLowerCase())) {
                const d = document.createElement('div');
                d.style = "padding:10px; background:#333; margin:2px; cursor:pointer;";
                d.innerHTML = `${products[id].name} <span style="float:right">${products[id].price}€</span>`;
                d.onclick = () => { addItem(id); res.innerHTML = ""; document.getElementById('search-input').value = ""; };
                res.appendChild(d);
            }
        }
    }

    function renderQuickKeys() {
        const bar = document.getElementById('quick-keys-bar');
        for (let id in products) {
            const b = document.createElement('div');
            b.className = "q-btn";
            b.innerHTML = `${products[id].name}<br>${products[id].price}€`;
            b.onclick = () => addItem(id);
            bar.appendChild(b);
        }
    }

    function sellGiftCard() {
        let val = prompt("Syötä lahjakortin arvo (€):", "20.00");
        if (val) {
            items.push({ name: "LAHJAKORTTI", price: parseFloat(val) });
            render();
        }
    }

    window.onload = () => {
        renderQuickKeys();
        setInterval(() => { document.getElementById('date-time').innerText = new Date().toLocaleString('fi-FI'); }, 1000);
    };
</script>
</body>
</html>
