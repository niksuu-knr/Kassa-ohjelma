<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebPOS Advanced</title>
    <style>
        :root {
            --bg-dark: #1a1c20;
            --receipt-bg: #ffffff;
            --btn-gray: #3a3f4b;
            --btn-blue: #2980b9;
            --btn-green: #27ae60;
            --btn-red: #c0392b;
            --btn-yellow: #f39c12;
            --text-light: #ecf0f1;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-dark); color: var(--text-light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Yläpalkki */
        .header { display: flex; justify-content: space-between; padding: 10px 20px; background: #000; border-bottom: 1px solid #333; font-size: 0.85rem; }

        /* Pääalue */
        .main { display: flex; flex: 1; overflow: hidden; padding: 10px; gap: 10px; }

        /* Kuitti (Vasen) */
        .receipt-container { flex: 1; background: var(--receipt-bg); color: #333; border-radius: 4px; display: flex; flex-direction: column; }
        .receipt-list { flex: 1; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
        .receipt-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .receipt-item.selected { background: #d1ecf1; }
        .total-display { padding: 20px; background: #222; color: #fff; font-size: 2.2rem; text-align: right; font-weight: bold; }

        /* Numpad (Oikea) */
        .controls { width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .input-box { width: 100%; font-size: 2.5rem; padding: 10px; text-align: right; border: none; border-radius: 4px; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr) 0.8fr; gap: 5px; flex: 1; }
        .numpad button { font-size: 1.5rem; font-weight: bold; border: none; border-radius: 4px; background: #eee; cursor: pointer; }
        .numpad button:active { background: #ccc; }
        .btn-enter { background: var(--btn-green) !important; color: white; grid-row: span 2; }
        .btn-del { background: var(--btn-red) !important; color: white; }

        /* Alapalkki */
        .footer-menu { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: #000; padding: 5px; }
        .menu-btn { background: var(--btn-gray); border: none; color: white; padding: 12px 5px; font-size: 0.7rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-transform: uppercase; }
        .menu-btn span { opacity: 0.6; margin-bottom: 3px; font-size: 0.6rem; }
        .menu-btn:hover { background: #555; }
        .btn-urgent { background: var(--btn-red); }
        .btn-pay { background: var(--btn-blue); }

        /* Lisää toimintoja -modali */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #333; padding: 30px; border-radius: 10px; width: 80%; max-width: 800px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .modal-btn { padding: 20px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; background: var(--btn-gray); color: white; }
        .close-modal { grid-column: span 3; background: var(--btn-red); margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div>KÄYTTÄJÄ: NIKSU | KASSA 1 | <span id="date-time"></span></div>
    <div>VERKKOTILA: ONLINE</div>
</div>

<div class="main">
    <div class="receipt-container">
        <div style="padding:10px; font-weight:bold; border-bottom:1px solid #ccc;">MYYNNIN ALOITUS</div>
        <ul class="receipt-list" id="r-list"></ul>
        <div class="total-display">YHTEENSÄ: <span id="total-sum">0.00</span> €</div>
    </div>

    <div class="controls">
        <input type="text" class="input-box" id="buffer" placeholder="Syötä koodi..." readonly>
        <div class="numpad">
            <button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button><button class="btn-del" onclick="clr()">CLR</button>
            <button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button><button onclick="key('*')">KPL</button>
            <button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button><button class="btn-enter" onclick="ent()">ENTER</button>
            <button onclick="key('0')">0</button><button onclick="key('00')">00</button><button onclick="key('.')">,</button>
        </div>
    </div>
</div>

<div class="footer-menu">
    <button class="menu-btn" onclick="alert('Haku...')"><span>F1</span>Kuitinhaku</button>
    <button class="menu-btn" onclick="alert('Tuotehaku')"><span>F2</span>Tuotehaku</button>
    <button class="menu-btn" onclick="alert('Palautus')"><span>F3</span>Palautus</button>
    <button class="menu-btn" onclick="removeItem()"><span>F4</span>Poista rivi</button>
    <button class="menu-btn btn-urgent" onclick="voidAll()"><span>F5</span>Mitätöi</button>
    <button class="menu-btn btn-pay" onclick="pay('Kortti')"><span>F6</span>Kortti</button>
    <button class="menu-btn btn-pay" onclick="pay('Käteinen')"><span>F7</span>Käteinen</button>
    <button class="menu-btn btn-pay" onclick="pay('Lahjakortti')"><span>F8</span>Lahjakortti</button>
    <button class="menu-btn" onclick="openMore()"><span>F9</span>LISÄÄ...</button>
</div>

<div id="more-modal" class="modal">
    <div class="modal-content">
        <button class="modal-btn" onclick="alert('Myy lahjakortti')">Myy lahjakortti</button>
        <button class="modal-btn" onclick="alert('Tuotekatalogi')">Tuotekatalogi</button>
        <button class="modal-btn" onclick="alert('Myyjien hallinta')">Myyjien hallinta</button>
        <button class="modal-btn" onclick="alert('Kampanjat')">Kampanjoiden hallinta</button>
        <button class="modal-btn" onclick="alert('Jäsenrekisteri')">Jäsenrekisteri</button>
        <button class="modal-btn" onclick="report('X')">X-Raportti</button>
        <button class="modal-btn" onclick="report('Z')">Z-Raportti</button>
        <button class="modal-btn" onclick="location.reload()">Kirjaudu ulos</button>
        <button class="modal-btn close-modal" onclick="closeMore()">SULJE VALIKKO</button>
    </div>
</div>

<script>
    let items = [];
    let selectedIdx = -1;
    const buf = document.getElementById('buffer');

    function key(v) { buf.value += v; }
    function clr() { buf.value = ""; }

    function ent() {
        const v = buf.value;
        if(v === "1") addItem("Kahvi", 2.50);
        else if(v === "2") addItem("Pulla", 3.20);
        else if(v !== "") addItem("Yleistuote", parseFloat(v) || 1.00);
        clr();
    }

    function addItem(name, price) {
        items.push({name, price});
        render();
    }

    function render() {
        const list = document.getElementById('r-list');
        list.innerHTML = "";
        let total = 0;
        items.forEach((it, i) => {
            total += it.price;
            const li = document.createElement('li');
            li.className = `receipt-item ${selectedIdx === i ? 'selected' : ''}`;
            li.onclick = () => { selectedIdx = i; render(); };
            li.innerHTML = `<span>${it.name}</span><span>${it.price.toFixed(2)} €</span>`;
            list.appendChild(li);
        });
        document.getElementById('total-sum').innerText = total.toFixed(2);
    }

    function removeItem() {
        if(selectedIdx > -1) {
            items.splice(selectedIdx, 1);
            selectedIdx = -1;
            render();
        } else { alert("Valitse poistettava rivi kuitilta!"); }
    }

    function voidAll() { if(confirm("Mitätöidäänkö koko kuitti?")) { items = []; render(); } }

    function pay(m) {
        if(items.length === 0) return;
        alert("Maksettu " + m + ". Kiitos!");
        items = []; render();
    }

    function openMore() { document.getElementById('more-modal').style.display = 'flex'; }
    function closeMore() { document.getElementById('more-modal').style.display = 'none'; }

    function report(type) {
        alert(type + "-raportti tulostettu selaimen konsoliin (testi).");
        console.log(type + "-RAPORTTI", items);
        closeMore();
    }

    // Kellon päivitys
    setInterval(() => {
        document.getElementById('date-time').innerText = new Date().toLocaleString('fi-FI');
    }, 1000);
</script>

</body>
</html>
