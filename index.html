<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-POS Professional - Market Edition</title>
    <style>
        :root {
            --s-green: #008a3d;
            --danger: #e30613;
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --text: #ffffff;
            --receipt-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-left-color: var(--s-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Yläpalkki */
        .header {
            background: #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--s-green);
        }

        /* Pääasettelu */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 450px;
            flex-grow: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        /* Kuittialue */
        #receipt-container {
            background: var(--receipt-bg);
            color: #000;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #r-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .receipt-row.selected { 
            background: #e8f5e9; 
            border-left: 8px solid var(--s-green);
            padding-left: 5px;
        }

        /* Hallintapaneeli */
        .display-unit {
            background: #000;
            padding: 20px;
            text-align: right;
            border: 2px solid #444;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #total-val { font-size: 3.5rem; color: var(--s-green); font-weight: bold; line-height: 1; }
        #buffer-val { font-size: 1.5rem; color: #fff; min-height: 1.8rem; letter-spacing: 2px; }

        /* Numeronäppäimistö */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
        }

        .n-btn {
            background: #444;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .n-btn:active { background: var(--s-green); }
        .n-btn.wide { grid-column: span 2; }
        .n-btn.enter { background: var(--s-green); height: 100%; grid-row: span 2; }

        .quick-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .q-btn {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Alapalkki */
        .footer {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            padding: 8px;
            background: #000;
        }

        .f-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 12px 0;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .f-btn span { display: block; font-weight: bold; color: var(--s-green); }

        #modal-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-inner {
            background: var(--panel);
            padding: 30px;
            border-radius: 10px;
            min-width: 350px;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

<div class="header">
    <div>KASSA: 01 | MYYJÄ: 001</div>
    <div id="date-time"></div>
</div>

<div class="main-container">
    <div id="receipt-container">
        <div id="r-list"></div>
        <div id="receipt-footer" style="padding:15px; border-top:2px solid #eee; background:#f9f9f9; color:#333;">
            <div style="display:flex; justify-content:space-between; font-size:1.4rem; font-weight:bold;">
                <span>VÄLISUMMA:</span><span id="subtotal-display">0.00 €</span>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="display-unit">
            <div id="buffer-val">0,00</div>
            <div id="total-val">0.00</div>
        </div>

        <div class="quick-keys" id="quick-keys-bar"></div>

        <div class="numpad">
            <button class="n-btn" onclick="numPress('7')">7</button>
            <button class="n-btn" onclick="numPress('8')">8</button>
            <button class="n-btn" onclick="numPress('9')">9</button>
            <button class="n-btn" onclick="numPress('4')">4</button>
            <button class="n-btn" onclick="numPress('5')">5</button>
            <button class="n-btn" onclick="numPress('6')">6</button>
            <button class="n-btn" onclick="numPress('1')">1</button>
            <button class="n-btn" onclick="numPress('2')">2</button>
            <button class="n-btn" onclick="numPress('3')">3</button>
            <button class="n-btn wide" onclick="numPress('0')">0</button>
            <button class="n-btn" onclick="clr()">C</button>
            <button class="n-btn enter" style="grid-column: 4; grid-row: 1/span 4;" onclick="handleEnter()">ENTER</button>
        </div>

        <div style="margin-top:10px;">
            <input type="text" id="search-input" placeholder="Haku..." oninput="searchProducts(this.value)" 
                   style="width:100%; padding:10px; background:#000; color:#fff; border:1px solid #555;">
            <div id="search-results" style="max-height:150px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<div class="footer">
    <button class="f-btn" onclick="pay('KORTTI')"><span>F1</span>KORTTI</button>
    <button class="f-btn" onclick="pay('KÄTEINEN')"><span>F2</span>KÄTEINEN</button>
    <button class="f-btn" onclick="toggleReturnMode()"><span>F4</span>PALAUTUS</button>
    <button class="f-btn" onclick="clr()"><span>F5</span>TYHJENNÄ</button>
    <button class="f-btn" onclick="deleteItem()"><span>F6</span>POISTA RIVI</button>
    <button class="f-btn" onclick="clearReceipt()"><span>F7</span>UUSI ASIAKAS</button>
    <button class="f-btn" onclick="sellGiftCard()"><span>F11</span>LAHJAKORTTI</button>
</div>

<div id="modal-container">
    <div id="modal-inner"></div>
</div>

<script>
    const products = {
        "1": { name: "Maito 1L", price: 1.15 },
        "2": { name: "Ruisleipä", price: 2.45 },
        "3": { name: "Kahvi 500g", price: 5.95 },
        "4": { name: "Muovikassi", price: 0.25 }
    };

    let items = [];
    let bufStr = "";
    let returnMode = false;
    let selectedIdx = -1;

    // --- NÄPPÄIMISTÖ ---
    function numPress(n) { bufStr += n; updateBuffer(); }
    function clr() { bufStr = ""; updateBuffer(); }
    
    function handleEnter() {
        if (bufStr !== "") {
            addItem(bufStr);
            clr();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key >= '0' && e.key <= '9') numPress(e.key);
        if (e.key === 'Enter') handleEnter();
        if (e.key === 'Backspace') { bufStr = bufStr.slice(0,-1); updateBuffer(); }
    });

    function updateBuffer() {
        const d = document.getElementById('buffer-val');
        if (bufStr === "") d.innerText = "0,00";
        else d.innerText = (parseInt(bufStr) / 100).toFixed(2).replace('.', ',');
    }

    // --- LOGIIKKA ---
    function addItem(id) {
        const p = products[id];
        if (p) {
            items.push({ name: p.name, price: returnMode ? -p.price : p.price });
            selectedIdx = items.length - 1;
            render();
        }
    }

    function render() {
        const list = document.getElementById('r-list');
        list.innerHTML = "";
        list.style.background = "#fff"; // Palautetaan valkoinen tausta kuitille
        let total = 0;

        if (returnMode) {
            list.innerHTML = `<div style="background:red; color:white; text-align:center; font-weight:bold;">PALAUTUSTILA</div>`;
        }

        items.forEach((it, i) => {
            total += it.price;
            const row = document.createElement('div');
            row.className = `receipt-row ${selectedIdx === i ? 'selected' : ''}`;
            row.onclick = () => { selectedIdx = i; render(); };
            row.innerHTML = `<span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)} €</span>`;
            list.appendChild(row);
        });

        document.getElementById('total-val').innerText = total.toFixed(2);
        document.getElementById('subtotal-display').innerText = total.toFixed(2) + " €";
    }

    // --- MAKSAMINEN JA PAPERIKUITTI ---
    function pay(method) {
        const total = parseFloat(document.getElementById('total-val').innerText);
        if (items.length === 0) return;

        if (method === 'KÄTEINEN') {
            let given = bufStr !== "" ? parseInt(bufStr) / 100 : total;
            const change = given - total;
            
            // Näytetään vaihtoraha hetken aikaa modaalissa
            const inner = document.getElementById('modal-inner');
            document.getElementById('modal-container').style.display = 'flex';
            inner.innerHTML = `<div style="text-align:center; color:white;">
                <h2>TAKAISIN:</h2><h1 style="font-size:4rem; color:var(--s-green);">${change.toFixed(2)} €</h1>
                <button class="modal-btn" onclick="printReceipt('${method}', ${total}, ${given}, ${change})">TULOSTA KUITTI</button>
            </div>`;
        } else {
            simulateCard(total);
        }
    }

    function simulateCard(amount) {
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        inner.innerHTML = `<div style="text-align:center; color:white;"><div class="spinner"></div><h2>KÄSITELLÄÄN...</h2></div>`;
        setTimeout(() => { printReceipt('KORTTI', amount, amount, 0); }, 2000);
    }

    function printReceipt(method, total, given, change) {
        document.getElementById('modal-container').style.display = 'none';
        const list = document.getElementById('r-list');
        
        let receiptHtml = `
            <div style="text-align:center; font-family:'Courier New'; color:#000; padding:10px; border:1px solid #ccc;">
                <h2 style="margin:0;">PRISMA MARKET</h2>
                <p style="font-size:0.8rem;">${new Date().toLocaleString()}<br>KUITTI: ${Math.floor(Math.random()*90000)}</p>
                <hr style="border:none; border-top:1px dashed #000;">
        `;
        
        items.forEach(it => {
            receiptHtml += `<div style="display:flex; justify-content:space-between;"><span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)}</span></div>`;
        });

        receiptHtml += `
                <hr style="border:none; border-top:1px dashed #000;">
                <h3 style="display:flex; justify-content:space-between;"><span>YHTEENSÄ</span><span>${total.toFixed(2)} €</span></h3>
                <div style="text-align:left; font-size:0.9rem;">
                    MAKSU: ${method}<br>
                    ANNETTU: ${given.toFixed(2)} €<br>
                    VAIHTORAHA: ${change.toFixed(2)} €
                </div>
                <p style="margin-top:20px; font-weight:bold;">KIITOS ASIOINNISTA!</p>
                <button onclick="clearReceipt()" style="width:100%; padding:10px; background:#000; color:#fff; cursor:pointer; margin-top:10px;">SULJE</button>
            </div>
        `;
        
        list.innerHTML = receiptHtml;
        list.scrollTop = 0;
    }

    function clearReceipt() {
        items = [];
        returnMode = false;
        clr();
        render();
    }

    function toggleReturnMode() { returnMode = !returnMode; render(); }
    function deleteItem() { if(selectedIdx > -1) { items.splice(selectedIdx, 1); selectedIdx = items.length-1; render(); } }
    function closeModal() { document.getElementById('modal-container').style.display = 'none'; }

    // --- TUOTEHAKU ---
    function searchProducts(q) {
        const res = document.getElementById('search-results');
        res.innerHTML = "";
        if (q.length < 1) return;
        for (let id in products) {
            if (products[id].name.toLowerCase().includes(q.toLowerCase())) {
                const d = document.createElement('div');
                d.style = "padding:8px; background:#333; margin:2px; cursor:pointer; font-size:0.9rem;";
                d.innerHTML = `${products[id].name} (${products[id].price}€)`;
                d.onclick = () => { addItem(id); res.innerHTML = ""; document.getElementById('search-input').value = ""; };
                res.appendChild(d);
            }
        }
    }

    function renderQuickKeys() {
        const bar = document.getElementById('quick-keys-bar');
        for (let id in products) {
            const b = document.createElement('div');
            b.className = "q-btn";
            b.innerHTML = `${products[id].name}<br>${products[id].price}€`;
            b.onclick = () => addItem(id);
            bar.appendChild(b);
        }
    }

    window.onload = () => {
        renderQuickKeys();
        setInterval(() => { document.getElementById('date-time').innerText = new Date().toLocaleString('fi-FI'); }, 1000);
    };
</script>
</body>
</html>
