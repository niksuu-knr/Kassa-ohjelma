<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-POS Professional - Market Edition</title>
    <style>
        :root {
            --s-green: #008a3d;
            --danger: #e30613;
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --text: #ffffff;
            --receipt-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            margin: 20px auto;
            width: 40px; height: 40px;
            border: 4px solid #333;
            border-left-color: var(--s-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .header {
            background: #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--s-green);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 450px;
            flex-grow: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        #receipt-container {
            background: var(--receipt-bg);
            color: #000;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #r-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }

        .receipt-row {
            display: flex; justify-content: space-between;
            padding: 5px 0; border-bottom: 1px solid #eee;
            cursor: pointer; font-size: 1.1rem;
        }

        .receipt-row.selected { background: #e8f5e9; border-left: 8px solid var(--s-green); padding-left: 5px; }

        .display-unit {
            background: #000; padding: 20px; text-align: right;
            border: 2px solid #444; border-radius: 5px; margin-bottom: 5px;
        }

        #total-val { font-size: 3.5rem; color: var(--s-green); font-weight: bold; line-height: 1; }
        #buffer-val { font-size: 1.5rem; color: #fff; min-height: 1.8rem; letter-spacing: 2px; }

        .quick-keys {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 5px; margin-bottom: 5px;
        }

        .q-btn {
            background: #333; border: 1px solid #555; color: white;
            padding: 15px 5px; text-align: center; cursor: pointer; font-size: 0.85rem; border-radius: 3px;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px; background: #000; padding: 10px; border-radius: 5px;
        }

        .n-btn {
            background: #444; color: white; border: none; padding: 15px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 3px;
        }

        .n-btn:active { background: var(--s-green); }
        .n-btn.enter { background: var(--s-green); grid-row: span 3; }

        .footer {
            display: grid; grid-template-columns: repeat(9, 1fr);
            gap: 4px; padding: 8px; background: #000;
        }

        .f-btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 12px 0; cursor: pointer; font-size: 0.7rem; border-radius: 3px;
        }

        .f-btn span { display: block; font-weight: bold; color: var(--s-green); }

        #modal-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }

        #modal-inner {
            background: var(--panel); padding: 30px; border-radius: 10px;
            min-width: 400px; border: 2px solid #555;
        }

        .modal-btn {
            width: 100%; padding: 15px; margin: 5px 0;
            border: none; border-radius: 5px; cursor: pointer;
            font-weight: bold; font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="header">
    <div>KASSA: 01 | MYYJÄ: 001</div>
    <div id="date-time"></div>
</div>

<div class="main-container">
    <div id="receipt-container">
        <div id="r-list"></div>
        <div id="receipt-footer" style="padding:15px; border-top:2px solid #eee; background:#f9f9f9; color:#333;">
            <div style="display:flex; justify-content:space-between; font-size:1.4rem; font-weight:bold;">
                <span>VÄLISUMMA:</span><span id="subtotal-display">0.00 €</span>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <!-- NÄYTTÖ -->
        <div class="display-unit">
            <div id="buffer-val">0,00</div>
            <div id="total-val">0.00</div>
        </div>

        <!-- PIKATUOTTEET (NÄYTÖN ALLA) -->
        <div class="quick-keys" id="quick-keys-bar"></div>

        <!-- NUMERONÄPPÄIMISTÖ -->
        <div class="numpad">
            <button class="n-btn" onclick="numPress('7')">7</button>
            <button class="n-btn" onclick="numPress('8')">8</button>
            <button class="n-btn" onclick="numPress('9')">9</button>
            <button class="n-btn" style="background:#666;" onclick="clr()">C</button>
            
            <button class="n-btn" onclick="numPress('4')">4</button>
            <button class="n-btn" onclick="numPress('5')">5</button>
            <button class="n-btn" onclick="numPress('6')">6</button>
            <button class="n-btn enter" onclick="handleEnter()">ENTER</button>
            
            <button class="n-btn" onclick="numPress('1')">1</button>
            <button class="n-btn" onclick="numPress('2')">2</button>
            <button class="n-btn" onclick="numPress('3')">3</button>
            
            <button class="n-btn" onclick="numPress('0')">0</button>
            <button class="n-btn" onclick="numPress('00')">00</button>
            <button class="n-btn" onclick="deleteChar()">←</button>
        </div>

        <input type="text" id="search-input" placeholder="Tuotehaku..." oninput="searchProducts(this.value)" 
               style="width:100%; padding:12px; background:#000; color:#fff; border:1px solid #555; margin-top:10px; box-sizing:border-box;">
        <div id="search-results" style="max-height:80px; overflow-y:auto;"></div>
    </div>
</div>

<div class="footer">
    <button class="f-btn" onclick="pay('KORTTI')"><span>F1</span>KORTTI</button>
    <button class="f-btn" onclick="pay('KÄTEINEN')"><span>F2</span>KÄTEINEN</button>
    <button class="f-btn" onclick="toggleReturnMode()"><span>F4</span>PALAUTUS</button>
    <button class="f-btn" onclick="clearCurrentReceipt()"><span>F5</span>TYHJENNÄ</button>
    <button class="f-btn" onclick="deleteItem()"><span>F6</span>POISTA RIVI</button>
    <button class="f-btn" onclick="newCustomer()"><span>F7</span>UUSI ASIAKAS</button>
    <button class="f-btn" onclick="openAdminMenu()"><span>F9</span>LISÄÄ...</button>
    <button class="f-btn" onclick="openDiscountMenu()"><span>F10</span>ALENNUS</button>
    <button class="f-btn" onclick="sellGiftCard()"><span>F11</span>LAHJAKORTTI</button>
</div>

<div id="modal-container">
    <div id="modal-inner"></div>
</div>

<script>
    // TUOTETIETOKANTA
    const products = {
        "1": { name: "Maito 1L", price: 1.15 },
        "2": { name: "Ruisleipä", price: 2.45 },
        "3": { name: "Kahvi 500g", price: 5.95 },
        "4": { name: "Muovikassi", price: 0.25 },
        "5": { name: "Energiajuoma", price: 2.20, age: 15 },
        "6": { name: "Siideri 0.33", price: 2.90, age: 18 }
    };

    // MUOKATTAVAT ALENNUKSET
    const discountOptions = [
        { label: "-10%", value: 10 },
        { label: "-30%", value: 30 },
        { label: "-50%", value: 50 },
        { label: "-60% HÄVIKKI", value: 60 }
    ];

    let items = [];
    let bufStr = "";
    let returnMode = false;
    let selectedIdx = -1;

    // NUMEROIDEN KÄSITTELY (20+00=20,00€ MALLI)
    function numPress(n) { bufStr += n; updateBuffer(); }
    function clr() { bufStr = ""; updateBuffer(); }
    function deleteChar() { bufStr = bufStr.slice(0, -1); updateBuffer(); }
    function updateBuffer() {
        const d = document.getElementById('buffer-val');
        d.innerText = bufStr === "" ? "0,00" : (parseInt(bufStr) / 100).toFixed(2).replace('.', ',');
    }

    function handleEnter() {
        if (bufStr !== "") { addItem(bufStr); clr(); }
    }

    function addItem(id) {
        const p = products[id];
        if (!p) return;
        if (p.age && !returnMode) {
            showAgeCheck(p.age, () => finishAdd(p));
        } else {
            finishAdd(p);
        }
    }

    function finishAdd(p) {
        items.push({ ...p, price: returnMode ? -p.price : p.price });
        selectedIdx = items.length - 1;
        render();
        closeModal();
    }

    function showAgeCheck(limit, onSuccess) {
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        inner.innerHTML = `
            <div style="text-align:center; color:white;">
                <h1 style="background:var(--danger); padding:20px; font-size:3rem; margin:0;">IKÄRAJA ${limit}</h1>
                <p style="font-size:1.5rem; margin:20px 0;">TARKISTA HENKILÖPAPERIT!</p>
                <button class="modal-btn" style="background:var(--s-green); color:white;" id="age-ok">HYVÄKSYTTY (ENTER)</button>
                <button class="modal-btn" style="background:var(--danger); color:white;" onclick="closeModal()">HYLÄTTY (ESC)</button>
            </div>`;
        document.getElementById('age-ok').onclick = onSuccess;
    }

    // ALENNUSVALIKKO (MUOKATTAVAT)
    function openDiscountMenu() {
        if (selectedIdx === -1) { alert("VALITSE TUOTE KUITILTA ENSIN!"); return; }
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        
        let discountButtons = discountOptions.map(opt => 
            `<button class="modal-btn" onclick="applyDiscount(${opt.value})">${opt.label}</button>`
        ).join('');

        inner.innerHTML = `
            <div style="color:white; text-align:center;">
                <h2>F10 - ALENNUSVALIKKO</h2>
                <p>Tuote: ${items[selectedIdx].name}</p>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    ${discountButtons}
                </div>
                <button class="modal-btn" style="background:#666; margin-top:20px;" onclick="closeModal()">PERUUTA</button>
            </div>`;
    }

    function applyDiscount(percent) {
        let item = items[selectedIdx];
        item.name += ` (-${percent}%)`;
        item.price = item.price * (1 - percent / 100);
        render();
        closeModal();
    }

    function render() {
        const list = document.getElementById('r-list');
        list.innerHTML = "";
        list.style.background = "#fff";
        let total = 0;
        if (returnMode) list.innerHTML = `<div style="background:red; color:white; text-align:center; font-weight:bold; padding:5px;">PALAUTUSTILA</div>`;
        
        items.forEach((it, i) => {
            total += it.price;
            const row = document.createElement('div');
            row.className = `receipt-row ${selectedIdx === i ? 'selected' : ''}`;
            row.onclick = () => { selectedIdx = i; render(); };
            row.innerHTML = `<span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)} €</span>`;
            list.appendChild(row);
        });
        document.getElementById('total-val').innerText = total.toFixed(2);
        document.getElementById('subtotal-display').innerText = total.toFixed(2) + " €";
    }

    function pay(method) {
        const total = parseFloat(document.getElementById('total-val').innerText);
        if (items.length === 0) return;
        if (method === 'KÄTEINEN') {
            let given = bufStr !== "" ? parseInt(bufStr) / 100 : total;
            const change = given - total;
            const inner = document.getElementById('modal-inner');
            document.getElementById('modal-container').style.display = 'flex';
            inner.innerHTML = `<div style="text-align:center; color:white;">
                <h2>TAKAISIN:</h2><h1 style="font-size:4rem; color:var(--s-green);">${change.toFixed(2)} €</h1>
                <button class="modal-btn" style="background:var(--s-green);" onclick="printReceipt('${method}', ${total}, ${given}, ${change})">MAKSU VALMIS</button>
            </div>`;
        } else {
            const inner = document.getElementById('modal-inner');
            document.getElementById('modal-container').style.display = 'flex';
            inner.innerHTML = `<div style="text-align:center; color:white;"><div class="spinner"></div><h2>KÄSITELLÄÄN KORTTIA...</h2></div>`;
            setTimeout(() => { printReceipt('KORTTI', total, total, 0); }, 2000);
        }
    }

    function printReceipt(method, total, given, change) {
        closeModal();
        const list = document.getElementById('r-list');
        let html = `<div style="text-align:center; color:#000; font-family:'Courier New';"><h2 style="margin:0;">PRISMA</h2><p>${new Date().toLocaleString()}</p><hr style="border:1px dashed #000;">`;
        items.forEach(it => { html += `<div style="display:flex; justify-content:space-between;"><span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)}</span></div>`; });
        html += `<hr style="border:1px dashed #000;"><h3>YHTEENSÄ: ${total.toFixed(2)} €</h3><p>MAKSU: ${method}<br>VAIHTO: ${change.toFixed(2)} €</p><button onclick="newCustomer()" style="width:100%; padding:10px; background:#000; color:#fff;">SULJE</button></div>`;
        list.innerHTML = html;
    }

    function openAdminMenu() {
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        inner.innerHTML = `<div style="color:white; text-align:center;"><h2>F9 - HALLINTA</h2><button class="modal-btn" onclick="alert('X-Raportti tulostettu')">X-RAPORTTI</button><button class="modal-btn" onclick="alert('Z-Raportti tulostettu')">Z-RAPORTTI</button><button class="modal-btn" onclick="closeModal()">SULJE</button></div>`;
    }

    function newCustomer() { items = []; returnMode = false; clr(); render(); }
    function clearCurrentReceipt() { if(confirm("Tyhjennetäänkö kuitin sisältö?")) newCustomer(); }
    function toggleReturnMode() { returnMode = !returnMode; render(); }
    function deleteItem() { if(selectedIdx > -1) { items.splice(selectedIdx, 1); selectedIdx = items.length-1; render(); } }
    function closeModal() { document.getElementById('modal-container').style.display = 'none'; }
    function sellGiftCard() { let v = prompt("Arvo (€):"); if(v) { items.push({name:"LAHJAKORTTI", price:parseFloat(v)}); render(); } }

    function searchProducts(q) {
        const res = document.getElementById('search-results'); res.innerHTML = "";
        if (q.length < 1) return;
        for (let id in products) {
            if (products[id].name.toLowerCase().includes(q.toLowerCase())) {
                const d = document.createElement('div');
                d.style = "padding:8px; background:#333; margin:2px; cursor:pointer;";
                d.innerHTML = `${products[id].name} (${products[id].price}€)`;
                d.onclick = () => { addItem(id); res.innerHTML = ""; document.getElementById('search-input').value = ""; };
                res.appendChild(d);
            }
        }
    }

    window.onload = () => {
        const bar = document.getElementById('quick-keys-bar');
        ["1", "2", "3", "4"].forEach(id => {
            const b = document.createElement('button'); b.className = "q-btn";
            b.innerHTML = `${products[id].name}<br>${products[id].price}€`;
            b.onclick = () => addItem(id); bar.appendChild(b);
        });
        setInterval(() => { document.getElementById('date-time').innerText = new Date().toLocaleString('fi-FI'); }, 1000);
    };
</script>
</body>
</html>
