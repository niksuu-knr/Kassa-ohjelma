<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebPOS Pro</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --primary: #2c3e50;
            --accent: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --key-bg: #ffffff;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }

        /* Vasen puoli: Kuitti */
        #receipt-section { width: 40%; display: flex; flex-direction: column; border-right: 2px solid #ddd; background: white; }
        .receipt-header { padding: 20px; background: var(--primary); color: white; }
        #item-list { flex-grow: 1; overflow-y: auto; padding: 10px; list-style: none; }
        .receipt-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .receipt-item:hover { background: #f9f9f9; }
        .totals { padding: 20px; font-size: 1.5rem; font-weight: bold; background: #eee; }

        /* Oikea puoli: Ohjaimet */
        #control-section { width: 60%; display: grid; grid-template-rows: auto 1fr auto; padding: 20px; gap: 20px; }
        
        /* Syöttöpuskuri */
        #input-buffer { 
            width: 100%; font-size: 2rem; padding: 15px; border: 3px solid var(--primary); 
            border-radius: 8px; box-sizing: border-box; text-align: right; outline: none;
        }

        /* Näppäimistöt */
        .grid-container { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

        button { 
            padding: 20px; font-size: 1.2rem; border: none; border-radius: 8px; 
            cursor: pointer; background: var(--key-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: active 0.1s; -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: translateY(2px); background: #ddd; }
        .btn-main { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-nav { background: var(--primary); color: white; }
    </style>
</head>
<body>

<section id="receipt-section">
    <div class="receipt-header">
        <h2 id="current-user">Myyjä: Matti M.</h2>
        <div id="receipt-id">Kuitti: #10045</div>
    </div>
    <ul id="item-list">
        <!-- Tuotteet tulevat tähän -->
    </ul>
    <div class="totals">
        YHTEENSÄ: <span id="total-amount">0.00</span> €
    </div>
</section>

<section id="control-section">
    <input type="text" id="input-buffer" placeholder="Syötä koodi, jäsen tai summa..." autofocus>
    
    <div class="grid-container">
        <!-- Numeronäppäimistö -->
        <div class="numpad">
            <button onclick="addInput('7')">7</button><button onclick="addInput('8')">8</button><button onclick="addInput('9')">9</button>
            <button onclick="addInput('4')">4</button><button onclick="addInput('5')">5</button><button onclick="addInput('6')">6</button>
            <button onclick="addInput('1')">1</button><button onclick="addInput('2')">2</button><button onclick="addInput('3')">3</button>
            <button onclick="addInput('0')">0</button><button onclick="addInput('00')">00</button>
            <button class="btn-main" onclick="handleEnter()">ENTER</button>
        </div>

        <!-- Pikatoiminnot -->
        <div class="actions">
            <button class="btn-nav" onclick="showCatalog('prod')">Tuotteet</button>
            <button class="btn-nav" onclick="showCatalog('promo')">Kampanjat</button>
            <button class="btn-nav" onclick="addMember()">Uusi Jäsen</button>
            <button class="btn-nav" onclick="sellGiftCard()">Lahjakortti</button>
            <button class="btn-danger" onclick="voidReceipt()">Mitätöi</button>
            <button class="btn-danger" onclick="removeItem()">Poista rivi</button>
            <button onclick="processPayment('Kortti')">KORTTI</button>
            <button onclick="processPayment('Käteinen')">KÄTEINEN</button>
            <button class="btn-nav" onclick="generateReport('Z')">Z-Raportti</button>
            <button onclick="logout()">LOGOUT</button>
        </div>
    </div>
</section>

<script>
    let currentReceipt = [];
    let buffer = document.getElementById('input-buffer');

    // Fokus puskuriin aina (viivakoodinlukijaa varten)
    document.addEventListener('click', () => buffer.focus());

    function addInput(val) {
        buffer.value += val;
    }

    function handleEnter() {
        const val = buffer.value;
        if (!val) return;

        // Logiikka: Jos puskurissa on numeroita ja painetaan enter
        // 1. Onko se tunnettu tuotekoodi?
        // 2. Onko se jäsennumero (esim. alkaa 99)?
        // 3. Onko se summa (käteismaksu)?
        
        if (val.length > 5) {
            addItem({ id: val, name: "Tuote " + val, price: 12.50 });
        } else if (val.startsWith("99")) {
            alert("Jäsen tunnistettu!");
        } else {
            // Oletetaan että kyseessä on hinta/määrä jos lyhyt
            alert("Käsitellään komento: " + val);
        }
        
        buffer.value = "";
    }

    function addItem(product) {
        currentReceipt.push(product);
        renderReceipt();
    }

    function renderReceipt() {
        const list = document.getElementById('item-list');
        list.innerHTML = "";
        let total = 0;
        
        currentReceipt.forEach((item, index) => {
            total += item.price;
            list.innerHTML += `<li class="receipt-item" onclick="selectItem(${index})">
                <span>${item.name}</span>
                <span>${item.price.toFixed(2)} €</span>
            </li>`;
        });

        // Käteisen pyöristys (0.05 tarkkuus)
        const roundedTotal = (Math.round(total * 20) / 20).toFixed(2);
        document.getElementById('total-amount').innerText = roundedTotal;
    }

    function processPayment(method) {
        if (currentReceipt.length === 0) return;
        const total = document.getElementById('total-amount').innerText;
        alert(`Maksu suoritettu: ${total} € (${method})`);
        currentReceipt = [];
        renderReceipt();
    }

    function voidReceipt() {
        if(confirm("Mitätöidäänkö koko myynti?")) {
            currentReceipt = [];
            renderReceipt();
        }
    }

    // Näppäimistökuuntelija pikanäppäimille
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleEnter();
        if (e.key === 'Escape') voidReceipt();
        if (e.key === '+') processPayment('Käteinen');
    });
</script>

</body>
</html>
