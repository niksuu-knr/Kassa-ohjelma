<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-POS Professional - Market Edition</title>
    <style>
        :root {
            --s-green: #008a3d;
            --danger: #e30613;
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --text: #ffffff;
            --receipt-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-left-color: var(--s-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Yläpalkki */
        .header {
            background: #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--s-green);
        }

        #member-display { color: var(--s-green); font-weight: bold; }

        /* Pääalue */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 450px;
            flex-grow: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        /* Kuittialue */
        #receipt-container {
            background: var(--receipt-bg);
            color: #000;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        #r-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .receipt-row.selected { 
            background: #e8f5e9; 
            border-left: 8px solid var(--s-green);
            padding-left: 5px;
        }

        /* Hallintapaneeli */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .display-unit {
            background: #000;
            padding: 25px;
            text-align: right;
            border: 2px solid #444;
            border-radius: 5px;
        }

        #total-val { font-size: 4.5rem; color: var(--s-green); font-weight: bold; line-height: 1; }
        #buffer-val { font-size: 1.8rem; color: #fff; min-height: 2rem; letter-spacing: 2px; }

        .quick-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 10px;
            background: var(--panel);
            border-radius: 5px;
        }

        .q-btn {
            background: linear-gradient(145deg, #444, #222);
            border: 1px solid #555;
            color: white;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Alapalkki */
        .footer {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 4px;
            padding: 8px;
            background: #000;
        }

        .f-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 12px 0;
            cursor: pointer;
            font-size: 0.75rem;
            border-radius: 3px;
        }

        .f-btn span { display: block; font-weight: bold; color: var(--s-green); }

        /* Modaalit */
        #modal-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-inner {
            background: var(--panel);
            padding: 30px;
            border-radius: 10px;
            min-width: 500px;
            border: 2px solid #555;
        }

        .modal-btn {
            padding: 18px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            background: #444;
            color: white;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="header">
    <div>KASSA: 01 | MYYJÄ: 001</div>
    <div id="member-display"></div>
    <div id="date-time"></div>
</div>

<div class="main-container">
    <div id="receipt-container">
        <div id="r-list"></div>
        <div id="receipt-footer" style="padding:15px; border-top:2px solid #eee; background:#f9f9f9; color:#333;">
            <div style="display:flex; justify-content:space-between; font-size:1.4rem; font-weight:bold;">
                <span>VÄLISUMMA:</span><span id="subtotal-display">0.00 €</span>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="display-unit">
            <div id="buffer-val">0,00</div>
            <div id="total-val">0.00</div>
        </div>

        <div class="quick-keys" id="quick-keys-bar"></div>

        <div style="flex-grow:1; background:var(--panel); padding:15px; border-radius:5px; border:1px solid #444;">
            <h3 style="margin-top:0; color:var(--s-green);">TUOTEHAKU</h3>
            <input type="text" id="search-input" placeholder="Hae tuotetta..." oninput="searchProducts(this.value)" 
                   style="width:100%; padding:12px; background:#000; color:#fff; border:1px solid #555;">
            <div id="search-results" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<div class="footer">
    <button class="f-btn" onclick="pay('KORTTI')"><span>F1</span>KORTTI</button>
    <button class="f-btn" onclick="pay('KÄTEINEN')"><span>F2</span>KÄTEINEN</button>
    <button class="f-btn" onclick="openReceiptSearch()"><span>F3</span>KUITINHAKU</button>
    <button class="f-btn" onclick="toggleReturnMode()"><span>F4</span>PALAUTUS</button>
    <button class="f-btn" onclick="clr()"><span>F5</span>TYHJENNÄ</button>
    <button class="f-btn" onclick="deleteItem()"><span>F6</span>POISTA RIVI</button>
    <button class="f-btn" onclick="readMemberCard()"><span>F8</span>JÄSENKORTTI</button>
    <button class="f-btn" onclick="openMore()"><span>F9</span>LISÄÄ...</button>
    <button class="f-btn" onclick="openDiscountMenu()"><span>F10</span>ALENNUS</button>
    <button class="f-btn" onclick="sellGiftCard()"><span>F11</span>LAHJAKORTTI</button>
</div>

<div id="modal-container">
    <div id="modal-inner"></div>
</div>

<script>
    // --- DATABASE ---
    let products = JSON.parse(localStorage.getItem('prism_products')) || {
        "1": { name: "Maito 1L", price: 1.15 },
        "2": { name: "Ruisleipä", price: 2.45 },
        "3": { name: "Kahvi 500g", price: 5.95 },
        "4": { name: "Muovikassi", price: 0.25 },
        "GIFT": { name: "LAHJAKORTTI", price: 0 }
    };
    let allReceipts = JSON.parse(localStorage.getItem('pos_history')) || [];
    let memberRegistry = { "123": "MATTI MEIKÄLÄINEN" };
    let manualDiscounts = { "1": { label: "HÄVIKKI -30%", type: "PERCENT", value: 30 }, "2": { label: "HÄVIKKI -60%", type: "PERCENT", value: 60 }};

    // --- STATE ---
    let items = [];
    let isMember = false;
    let returnMode = false;
    let selectedIdx = -1;
    let bufStr = "";
    let rCounter = allReceipts.length + 10001;

    // --- CORE ---
    function addItem(id) {
        if(id === "GIFT") { sellGiftCard(); return; }
        let p = products[id];
        if (!p) return;
        let price = returnMode ? -Math.abs(p.price) : p.price;
        items.push({ name: p.name, price: price, id: id });
        selectedIdx = items.length - 1;
        render();
    }

    function render() {
        const list = document.getElementById('r-list');
        const totalDisp = document.getElementById('total-val');
        const subtotalDisp = document.getElementById('subtotal-display');
        list.innerHTML = "";
        list.style.background = "#fff";
        
        let total = 0;
        if (returnMode) {
            list.innerHTML = `<div style="background:var(--danger); color:white; text-align:center; padding:8px; font-weight:bold;">PALAUTUSTILA</div>`;
        }

        items.forEach((it, i) => {
            total += it.price;
            const row = document.createElement('div');
            row.className = `receipt-row ${selectedIdx === i ? 'selected' : ''}`;
            row.onclick = () => { selectedIdx = i; render(); };
            row.innerHTML = `<span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)}</span>`;
            list.appendChild(row);
        });

        totalDisp.innerText = total.toFixed(2);
        subtotalDisp.innerText = total.toFixed(2) + " €";
    }

    // --- KEYBOARD & BUFFER ---
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key >= '0' && e.key <= '9') { bufStr += e.key; updateBuffer(); }
        if (e.key === 'Enter') {
            if (returnMode && bufStr.length >= 4) { searchReceipt(bufStr); }
            else { addItem(bufStr); }
            clr();
        }
        if (e.key === 'Backspace') { bufStr = bufStr.slice(0,-1); updateBuffer(); }
        if (e.key === 'Escape') closeModal();
    });

    function updateBuffer() {
        const display = document.getElementById('buffer-val');
        if (bufStr.length === 0) { display.innerText = "0,00"; return; }
        display.innerText = (parseInt(bufStr) / 100).toFixed(2).replace('.', ',');
    }

    function clr() { bufStr = ""; updateBuffer(); }

    // --- PAYMENTS ---
    function pay(method) {
        const totalSum = parseFloat(document.getElementById('total-val').innerText);
        if (items.length === 0) return;

        if (method === 'KÄTEINEN') {
            let given = bufStr.length > 0 ? parseInt(bufStr) / 100 : totalSum;
            if (given < totalSum && !returnMode) { alert("SUMMA EI RIITÄ!"); return; }
            showChangeScreen(totalSum, given, given - totalSum);
        } else {
            simulateCardTerminal(totalSum);
        }
    }

    function simulateCardTerminal(amount) {
        const inner = document.getElementById('modal-inner');
        document.getElementById('modal-container').style.display = 'flex';
        inner.innerHTML = `
            <div style="text-align:center; padding:20px; color:white;">
                <div style="font-size:4rem;">💳</div>
                <h2 id="term-status" style="color:orange;">ODOTTAA KORTTIA...</h2>
                <p style="font-size:1.5rem;">SUMMA: ${amount.toFixed(2)} €</p>
                <div class="spinner"></div>
            </div>`;
        
        setTimeout(() => { document.getElementById('term-status').innerText = "KÄSITELLÄÄN..."; }, 1500);
        setTimeout(() => { 
            document.getElementById('term-status').innerText = "MAKSU HYVÄKSYTTY!";
            document.getElementById('term-status').style.color = "var(--s-green)";
            setTimeout(() => { finalizeTransaction('KORTTI', amount, amount, 0); }, 1000);
        }, 3000);
    }

    function showChangeScreen(t, g, c) {
        const inner = document.getElementById('modal-inner');
        inner.innerHTML = `
            <div style="text-align:center; color:white;">
                <p style="font-size:1.5rem;">TAKAISIN</p>
                <h1 style="font-size:5rem; color:var(--s-green); margin:0;">${c.toFixed(2)} €</h1>
                <button class="modal-btn" style="width:100%; background:var(--s-green);" onclick="finalizeTransaction('KÄTEINEN', ${t}, ${g}, ${c})">KUITTAA MAKSU</button>
            </div>`;
        document.getElementById('modal-container').style.display = 'flex';
    }

    function finalizeTransaction(m, t, g, c) {
        const receiptData = { id: rCounter++, time: new Date().toLocaleString('fi-FI'), items: [...items], total: t.toFixed(2), method: m, given: g.toFixed(2), change: c.toFixed(2) };
        allReceipts.unshift(receiptData);
        localStorage.setItem('pos_history', JSON.stringify(allReceipts));
        printPaperReceipt(receiptData);
        items = []; returnMode = false; clr();
    }

    function printPaperReceipt(data) {
        const list = document.getElementById('r-list');
        let html = `<div style="text-align:center; font-family:'Courier New'; border:1px solid #ccc; padding:10px; color:#000;">
            <h3>PRISMA MARKET</h3><p>${data.time}<br>KUITTI: ${data.id}</p><hr>`;
        data.items.forEach(it => { html += `<div style="display:flex; justify-content:space-between;"><span>${it.name.toUpperCase()}</span><span>${it.price.toFixed(2)}</span></div>`; });
        html += `<hr><h2 style="display:flex; justify-content:space-between;"><span>YHTEENSÄ</span><span>${data.total}€</span></h2>
            <div style="text-align:left;">MAKSU: ${data.method}<br>ANNETTU: ${data.given}€<br>VAIHTORAHA: ${data.change}€</div>
            <p>KIITOS ASIOINNISTA!</p>
            <button class="modal-btn" style="width:100%; background:#000;" onclick="render()">UUSI ASIAKAS</button></div>`;
        list.innerHTML = html;
        closeModal();
    }

    // --- OTHER FUNCTIONS ---
    function toggleReturnMode() { returnMode = !returnMode; render(); }
    function deleteItem() { if(selectedIdx > -1) { items.splice(selectedIdx, 1); selectedIdx = items.length - 1; render(); } }
    function clr() { items = []; render(); }
    function closeModal() { document.getElementById('modal-container').style.display = 'none'; }

    function searchProducts(query) {
        const res = document.getElementById('search-results');
        res.innerHTML = "";
        if (query.length < 2) return;
        for (let id in products) {
            if (products[id].name.toLowerCase().includes(query.toLowerCase())) {
                const div = document.createElement('div');
                div.style.padding = "10px"; div.style.background = "#333"; div.style.margin = "2px 0"; div.style.cursor = "pointer";
                div.innerHTML = `${products[id].name} <span style="float:right">${products[id].price}€</span>`;
                div.onclick = () => { addItem(id); document.getElementById('search-input').value = ""; res.innerHTML = ""; };
                res.appendChild(div);
            }
        }
    }

    function renderQuickKeys() {
        const bar = document.getElementById('quick-keys-bar');
        ["1", "2", "3", "4", "GIFT"].forEach(id => {
            if (products[id]) {
                const btn = document.createElement('div');
                btn.className = "q-btn";
                btn.innerHTML = `${products[id].name}<br>${products[id].price}€`;
                btn.onclick = () => addItem(id);
                bar.appendChild(btn);
            }
        });
    }

    window.onload = () => {
        renderQuickKeys();
        render();
        setInterval(() => { document.getElementById('date-time').innerText = new Date().toLocaleString(); }, 1000);
    };
</script>
</body>
</html>
